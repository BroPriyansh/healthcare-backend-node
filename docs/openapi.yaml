openapi: 3.0.3
info:
  title: Healthcare Backend API
  version: 1.0.0
  description: REST API for account authentication, patient and doctor management, and patient-doctor assignments.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Patient:
      type: object
      required: [name, age, gender, address]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        age: { type: integer, minimum: 0, maximum: 130 }
        gender: { type: string, enum: [male, female, other, prefer_not_to_say] }
        address: { type: string, minLength: 3, maxLength: 500 }
        phone: { type: string, maxLength: 25 }
    Doctor:
      type: object
      required: [name, specialization, email]
      properties:
        name: { type: string }
        specialization: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        clinic_address: { type: string }
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200': { description: API is running }
  /api/auth/register:
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201': { description: User registered }
        '400': { description: Invalid request }
        '409': { description: Email already registered }
  /api/auth/login:
    post:
      summary: Login and receive JWT tokens
      responses:
        '200': { description: Login successful }
        '401': { description: Invalid credentials }
  /api/auth/refresh:
    post:
      summary: Refresh JWT tokens
      responses:
        '200': { description: Tokens refreshed }
        '401': { description: Invalid refresh token }
  /api/patients:
    get:
      security: [{ bearerAuth: [] }]
      summary: List current user's patients
      responses:
        '200': { description: Patient list }
        '401': { description: Unauthorized }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Patient' }
      responses:
        '201': { description: Patient created }
        '400': { description: Invalid patient data }
  /api/patients/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      security: [{ bearerAuth: [] }]
      summary: Get an owned patient
      responses:
        '200': { description: Patient details }
        '404': { description: Patient not found }
    put:
      security: [{ bearerAuth: [] }]
      summary: Update an owned patient
      responses:
        '200': { description: Patient updated }
        '400': { description: Invalid patient data }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete an owned patient
      responses:
        '204': { description: Patient deleted }
  /api/doctors:
    get:
      security: [{ bearerAuth: [] }]
      summary: List doctors
      responses:
        '200': { description: Doctor list }
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a doctor
      responses:
        '201': { description: Doctor created }
  /api/doctors/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      security: [{ bearerAuth: [] }]
      summary: Get a doctor
      responses:
        '200': { description: Doctor details }
        '404': { description: Doctor not found }
    put:
      security: [{ bearerAuth: [] }]
      summary: Update a doctor
      responses:
        '200': { description: Doctor updated }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete a doctor
      responses:
        '204': { description: Doctor deleted }
  /api/mappings:
    get:
      security: [{ bearerAuth: [] }]
      summary: List mappings for current user's patients
      responses:
        '200': { description: Mapping list }
    post:
      security: [{ bearerAuth: [] }]
      summary: Assign a doctor to a patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, doctor_id]
              properties:
                patient_id: { type: integer }
                doctor_id: { type: integer }
      responses:
        '201': { description: Assignment created }
        '409': { description: Duplicate assignment }
  /api/mappings/{patient_id}:
    get:
      security: [{ bearerAuth: [] }]
      summary: List doctors assigned to a patient owned by current user
      parameters:
        - { name: patient_id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Assigned doctors }
        '404': { description: Patient not found }
    delete:
      security: [{ bearerAuth: [] }]
      summary: Remove a mapping by mapping ID
      parameters:
        - { name: patient_id, in: path, required: true, description: Mapping ID for DELETE, schema: { type: integer } }
      responses:
        '204': { description: Mapping removed }
